name: Underware release
run-name: Underware uw-v${{ inputs.version }} from main

on:
  workflow_dispatch:
    inputs:
      version:
        description: Underware release version without the uw-v prefix
        required: true
        type: string
      commit:
        description: Exact main commit to release
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: underware-release
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      version: ${{ steps.release_info.outputs.version }}
      release_commit: ${{ steps.release_info.outputs.release_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release candidate
        id: release_info
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Underware releases must be dispatched from main" >&2
            exit 1
          fi

          version="$CANDIDATE_VERSION"
          tag_name="uw-v${version}"
          release_commit="$(git rev-parse HEAD)"
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Requested release commit must be a full Git commit SHA" >&2
            exit 1
          fi
          if [ "$release_commit" != "$REQUESTED_COMMIT" ]; then
            echo "Dispatched main commit $release_commit does not match requested commit $REQUESTED_COMMIT" >&2
            exit 1
          fi

          if ! ./scripts/release.sh validate-candidate "$version"; then
            echo "Underware release candidate $tag_name is invalid or already used" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          main_commit="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$release_commit" "$main_commit"; then
            echo "Release candidate must remain on origin/main" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  verify-version:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.90.0"

      - uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "25.x"

      - name: Build, verify, and archive Linux x86_64
        env:
          UNDERWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          target="x86_64-unknown-linux-gnu"
          cargo build --bin torii --release --target "$target"
          ./scripts/release.sh verify-binary "$UNDERWARE_VERSION" "target/$target/release/torii"
          tar -czvf "torii_${{ needs.prepare.outputs.tag_name }}_linux_amd64.tar.gz" -C "target/$target/release" torii
          mkdir -p linux/amd64
          mv "target/$target/release/torii" linux/amd64

      - name: Upload docker binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: linux
          retention-days: 14

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: torii_${{ needs.prepare.outputs.tag_name }}_linux_amd64.tar.gz
          retention-days: 14

  release:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs: [prepare, verify-version]
    runs-on: ${{ matrix.job.os }}
    env:
      PLATFORM_NAME: ${{ matrix.job.platform }}
      TARGET: ${{ matrix.job.target }}
      ARCH: ${{ matrix.job.arch }}
      UNDERWARE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      matrix:
        job:
          # The OS is used for the runner
          # The platform is a generic platform name
          # The target is used by Cargo
          # The arch is either 386, arm64 or amd64
          # The svm target platform to use for the binary https://github.com/roynalnaruto/svm-rs/blob/84cbe0ac705becabdc13168bae28a45ad2299749/svm-builds/build.rs#L4-L24
          - os: ubuntu-24.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            arch: arm64
            svm_target_platform: linux-aarch64
          - os: macos-15-intel
            platform: darwin
            target: x86_64-apple-darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            target: aarch64-apple-darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            target: x86_64-pc-windows-msvc
            arch: amd64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        name: Rust Toolchain Setup
        with:
          toolchain: "1.90.0"
          target: ${{ matrix.job.target }}
          cache-on-failure: true
          cache-key: ${{ matrix.job.target }}

      - uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "25.x"

      - name: Apple M1 setup
        if: ${{ matrix.job.target == 'aarch64-apple-darwin' }}
        run: |
          echo "SDKROOT=$(xcrun -sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun -sdk macosx --show-sdk-platform-version)" >> $GITHUB_ENV

      - name: Linux ARM setup
        if: ${{ matrix.job.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev
          # We build jemalloc with 64KB pagesize so that it works for all linux/arm64 pagesize variants
          # See: https://github.com/jemalloc/jemalloc/issues/467
          echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> $GITHUB_ENV

      # Workaround for https://github.com/actions/runner-images/issues/12432
      # from https://github.com/rust-lang/rust/issues/141626#issuecomment-2919419236
      # Visual Studio bug tracker https://developercommunity.visualstudio.com/t/Regression-from-1943:-linkexe-crashes/10912960
      - name: Setup RUSTFLAGS (Windows)
        if: ${{ matrix.job.target == 'x86_64-pc-windows-msvc' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('RUSTFLAGS', '-Csymbol-mangling-version=v0');

      - name: Build binary
        run: |
          cargo --version
          cargo build --bin torii --release --target ${{ matrix.job.target }}

      - name: Verify binary version
        env:
          UNDERWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          binary="target/${TARGET}/release/torii"
          if [ "$PLATFORM_NAME" = "win32" ]; then
            binary="${binary}.exe"
          fi
          ./scripts/release.sh verify-binary "$UNDERWARE_VERSION" "$binary"
        shell: bash

      - name: Archive binaries
        id: artifacts
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          if [ "$PLATFORM_NAME" == "linux" ]; then
            tar -czvf "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C ./target/${TARGET}/release torii
            echo "file_name=torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM_NAME" == "darwin" ]; then
            # We need to use gtar here otherwise the archive is corrupt.
            # See: https://github.com/actions/virtual-environments/issues/2619
            gtar -czvf "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C ./target/${TARGET}/release torii
            echo "file_name=torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          else
            ls ./target/${TARGET}/release
            cd ./target/${TARGET}/release
            7z a -tzip "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.zip" torii.exe
            mv "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.zip" ../../../
            echo "file_name=torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.zip" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # We move binaries so they match $TARGETPLATFORM in the Docker build
      - name: Move Binaries
        if: ${{ env.PLATFORM_NAME == 'linux' }}
        run: |
          mkdir -p $PLATFORM_NAME/$ARCH
          mv target/${TARGET}/release/torii $PLATFORM_NAME/$ARCH
        shell: bash

      - name: Upload docker binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.job.target }}
          path: ${{ env.PLATFORM_NAME }}
          retention-days: 14

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-${{ matrix.job.target }}
          path: ${{ steps.artifacts.outputs.file_name }}
          retention-days: 14

  verify-container:
    runs-on: ubuntu-latest
    needs: [prepare, verify-version, release]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          path: artifacts/linux
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

      - name: Verify multi-platform container build
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
        with:
          push: false
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            artifacts=artifacts

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, verify-version, release, verify-container]
    environment:
      name: underware-release
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          path: artifacts/linux
          merge-multiple: true

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or verify immutable release tag
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Release commit $RELEASE_COMMIT is no longer on origin/main" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            if [ "$(git cat-file -t "$TAG_NAME")" != "tag" ]; then
              echo "Existing release tag $TAG_NAME is not annotated" >&2
              exit 1
            fi
            if [ "$(git rev-parse "${TAG_NAME}^{commit}")" != "$RELEASE_COMMIT" ]; then
              echo "Existing release tag $TAG_NAME points at another commit" >&2
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG_NAME" "$RELEASE_COMMIT" -m "Underware Torii ${{ needs.prepare.outputs.version }}"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Create or update draft release
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/* --clobber
          else
            gh release create "$TAG_NAME" release-artifacts/* \
              --draft --generate-notes --target "$RELEASE_COMMIT" --verify-tag
          fi

      - name: Build and push docker image
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.tag_name }}
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            artifacts=artifacts

      - name: Publish draft release
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false
