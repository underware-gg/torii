name: Underware release

on:
  push:
    tags:
      - "uw-v*"

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      version: ${{ steps.release_info.outputs.version }}
      release_commit: ${{ steps.release_info.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify tag and release commit
        id: release_info
        run: |
          tag_name="${{ github.ref_name }}"
          version="${tag_name#uw-v}"
          release_commit="$(git rev-parse "${tag_name}^{commit}")"

          if [ "$version" = "$tag_name" ] || [ -z "$version" ]; then
            echo "Expected an Underware release tag, got $tag_name" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          main_commit="$(git rev-parse origin/main)"
          if [ "$release_commit" != "$main_commit" ]; then
            echo "Tag $tag_name must point at the current origin/main commit" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

  verify-version:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90.0"

      - uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "25.x"

      - name: Build and verify version
        env:
          UNDERWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --bin torii --release
          version="$(target/release/torii --version)"
          expected="torii ${UNDERWARE_VERSION}-uw (base torii "
          case "$version" in
            "$expected"*) ;;
            *)
              echo "Unexpected binary version: $version" >&2
              exit 1
              ;;
          esac

          case "$version" in
            *"base torii unknown"*|*", unknown)")
              echo "Incomplete binary version: $version" >&2
              exit 1
              ;;
          esac

  release:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs: [prepare, verify-version]
    runs-on: ${{ matrix.job.os }}
    env:
      PLATFORM_NAME: ${{ matrix.job.platform }}
      TARGET: ${{ matrix.job.target }}
      ARCH: ${{ matrix.job.arch }}
    strategy:
      matrix:
        job:
          # The OS is used for the runner
          # The platform is a generic platform name
          # The target is used by Cargo
          # The arch is either 386, arm64 or amd64
          # The svm target platform to use for the binary https://github.com/roynalnaruto/svm-rs/blob/84cbe0ac705becabdc13168bae28a45ad2299749/svm-builds/build.rs#L4-L24
          - os: ubuntu-latest-8-cores
            platform: linux
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-latest-8-cores-arm64
            platform: linux
            target: aarch64-unknown-linux-gnu
            arch: arm64
            svm_target_platform: linux-aarch64
          - os: macos-latest-large
            platform: darwin
            target: x86_64-apple-darwin
            arch: amd64
          - os: macos-latest-xlarge
            platform: darwin
            target: aarch64-apple-darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            target: x86_64-pc-windows-msvc
            arch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        name: Rust Toolchain Setup
        with:
          toolchain: "1.90.0"
          target: ${{ matrix.job.target }}
          cache-on-failure: true
          cache-key: ${{ matrix.job.target }}

      - uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "25.x"

      - name: Apple M1 setup
        if: ${{ matrix.job.target == 'aarch64-apple-darwin' }}
        run: |
          echo "SDKROOT=$(xcrun -sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun -sdk macosx --show-sdk-platform-version)" >> $GITHUB_ENV

      - name: Linux ARM setup
        if: ${{ matrix.job.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev
          # We build jemalloc with 64KB pagesize so that it works for all linux/arm64 pagesize variants
          # See: https://github.com/jemalloc/jemalloc/issues/467
          echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> $GITHUB_ENV

      # Workaround for https://github.com/actions/runner-images/issues/12432
      # from https://github.com/rust-lang/rust/issues/141626#issuecomment-2919419236
      # Visual Studio bug tracker https://developercommunity.visualstudio.com/t/Regression-from-1943:-linkexe-crashes/10912960
      - name: Setup RUSTFLAGS (Windows)
        if: ${{ matrix.job.target == 'x86_64-pc-windows-msvc' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('RUSTFLAGS', '-Csymbol-mangling-version=v0');

      - name: Build binary
        run: |
          cargo --version
          cargo build --bin torii --release --target ${{ matrix.job.target }}

      - name: Archive binaries
        id: artifacts
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          if [ "$PLATFORM_NAME" == "linux" ]; then
            tar -czvf "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C ./target/${TARGET}/release torii
            echo "file_name=torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM_NAME" == "darwin" ]; then
            # We need to use gtar here otherwise the archive is corrupt.
            # See: https://github.com/actions/virtual-environments/issues/2619
            gtar -czvf "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C ./target/${TARGET}/release torii
            echo "file_name=torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          else
            ls ./target/${TARGET}/release
            cd ./target/${TARGET}/release
            7z a -tzip "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.zip" torii.exe
            mv "torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.zip" ../../../
            echo "file_name=torii_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.zip" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # We move binaries so they match $TARGETPLATFORM in the Docker build
      - name: Move Binaries
        if: ${{ env.PLATFORM_NAME == 'linux' }}
        run: |
          mkdir -p $PLATFORM_NAME/$ARCH
          mv target/${TARGET}/release/torii $PLATFORM_NAME/$ARCH
        shell: bash

      - name: Upload docker binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.job.target }}
          path: ${{ env.PLATFORM_NAME }}
          retention-days: 14

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.job.target }}
          path: ${{ steps.artifacts.outputs.file_name }}
          retention-days: 14

  create-draft-release:
    runs-on: ubuntu-latest-4-cores
    needs: [prepare, release]
    env:
      GITHUB_USER: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R artifacts
      - run: gh release create ${{ needs.prepare.outputs.tag_name }} ./artifacts/*.{gz,zip} --generate-notes --draft

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, release, create-draft-release]
    environment:
      name: underware-release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: artifacts/linux
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.tag_name }}
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            artifacts=artifacts

      - name: Publish draft release
        run: gh release edit ${{ needs.prepare.outputs.tag_name }} --draft=false
