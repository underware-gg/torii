name: Release policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned CI policy tools
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/ci-policy-tools"
          mkdir -p "$tools_dir"

          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$tools_dir/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tools_dir/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$tools_dir/actionlint.tar.gz" -C "$tools_dir"
          sudo install "$tools_dir/actionlint" /usr/local/bin/actionlint

          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$tools_dir/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  $tools_dir/shellcheck.tar.xz" | sha256sum --check --status
          tar -xJf "$tools_dir/shellcheck.tar.xz" -C "$tools_dir"
          sudo install "$tools_dir/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Check repository CI policy
        run: ./scripts/check_ci_policy.sh

      - name: Check release tooling
        run: |
          if ./scripts/release.sh validate-version 01.2.3 >release-check.out 2>&1; then
            echo "release helper accepted a non-canonical version" >&2
            exit 1
          fi
          grep -Fx 'error: version must be release semver (for example: 0.4.0)' release-check.out
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'
